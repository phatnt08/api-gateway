server:
  port: 8888

application:
  name: api-gateway
  description: API Gateway for microservices
  version: 1.0.0

app:
  api-prefix: /api

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=${app.api-prefix}/identity/** # api prefix to reference the variable be defined in the app section
          filters:
            - StripPrefix=1 # =1 will replace one / in path (/api) | =2 will replace two / in path (/api/identity)
        - id: profile-service
          uri: ${PROFILE_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=${app.api-prefix}/profile/users/** # to add multiple paths use , to separate them
            # for an example - Path=${app.api-prefix}/profile/roles/**, ${app.api-prefix}/profile/internal/users/**, ...
          filters:
            - StripPrefix=1